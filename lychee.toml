# Lychee link checker configuration.
# Lychee automatically reads this file from the repository root when run by
# the reusable workflow IndrajeetPatil/workflows/.github/workflows/check-link-rot.yaml.

# Exclude loopback addresses (localhost, 127.0.0.1, ::1)
exclude_loopback = true

# Exclude mailto: links from being checked
include_mail = false

# Exclude URLs that trigger false positives in automated link checkers
exclude = [
  # LinkedIn answers non-browser clients with HTTP 999 (anti-scraping),
  # causing speaker profile and company links to fail automated CI checks.
  '^https://www\.linkedin\.com/',

  # www.fsf.org only supports finite-field DHE ciphers in TLS 1.2, which
  # lychee's rustls backend does not support, causing TLS handshake failure.
  '^https://www\.fsf\.org/',

  # www.gnu.org returns HTTP 429 to shared datacenter IP ranges (including
  # GitHub Actions runners) even when requests are rate-limited and pages are healthy.
  '^https://www\.gnu\.org/',

  # web.archive.org frequently returns HTTP 503 under rate limiting on CI runners
  # while snapshots remain immutable and healthy.
  '^https://web\.archive\.org/',

  # RevealJS website drops TLS 1.3 handshakes when modern clients offer post-quantum
  # key shares (X25519MLKEM768), causing false-positive connection resets in automated checks.
  '^https://revealjs\.com/',
]
